name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: csrs_test
          POSTGRES_PASSWORD: ci_example_only
          POSTGRES_DB: csrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csrs_test -d csrs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CSRS_TEST_DATABASE_URL: postgresql+psycopg://csrs_test:ci_example_only@localhost:5432/csrs_test
      CSRS_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.lock
      - name: Install backend and test tools
        run: python -m pip install -c backend/requirements-dev.lock -e './backend[dev]'
      - name: Lint
        run: python -m ruff check backend
      - name: Check formatting
        run: python -m ruff format --check backend
      - name: Unit and contract tests
        run: python -m pytest backend/tests -m 'not integration'
      - name: PostgreSQL integration tests (required)
        run: python -m pytest backend/tests/integration
      - name: Alembic revision discovery
        working-directory: backend
        run: python -m alembic heads

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Use public local example configuration
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build backend frontend backend-test
      - name: Exercise Compose development stack
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T backend python -m alembic upgrade head
          docker compose exec -T backend python -m alembic check
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/api/v1/health/live
          curl --fail http://localhost:8000/api/v1/health/ready
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:5173/
          curl --fail --retry 5 --retry-delay 2 http://localhost:5173/api/v1/health/ready
      - name: Run tests inside Compose against isolated PostgreSQL
        run: docker compose --profile test run --rm backend-test
      - name: Worker startup, backlog recovery, and graceful shutdown
        shell: bash
        run: |
          docker compose --profile worker build worker
          scenario=$(docker compose exec -T backend python scripts/smoke_worker.py prepare)
          docker compose --profile worker up -d worker
          docker compose exec -T backend python scripts/smoke_worker.py verify "$scenario"
          docker compose --profile worker stop worker
      - name: Redis cache, outage, cold API startup, worker independence, and recovery
        shell: bash
        run: |
          docker compose --profile worker up -d worker
          docker compose exec -T backend python scripts/smoke_redis.py available
          docker compose stop redis
          docker compose --profile worker restart worker
          docker compose up -d --no-deps --force-recreate backend
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8000/api/v1/health/ready
          docker compose exec -T backend python scripts/smoke_redis.py outage
          docker compose up -d --wait --wait-timeout 60 redis
          docker compose exec -T backend python scripts/smoke_redis.py recovered
          docker compose --profile worker stop worker
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile test --profile worker logs --no-color
      - name: Stop disposable CI services
        if: always()
        run: docker compose --profile test --profile worker down --volumes
