openapi: 3.1.0
info:
  title: CSRS
  description: CSRS health, authentication, and event management. Booking is not implemented
  version: 0.3.0
paths:
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Liveness
      operationId: liveness_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: Readiness
      operationId: readiness_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: PostgreSQL unavailable
