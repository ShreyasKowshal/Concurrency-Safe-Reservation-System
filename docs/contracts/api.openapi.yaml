components:
  schemas:
    AuthResponse:
      properties:
        csrf_token:
          type: string
          title: Csrf Token
        user:
          $ref: '#/components/schemas/UserResponse'
      type: object
      required:
      - csrf_token
      - user
      title: AuthResponse
    CapacityUpdate:
      properties:
        capacity:
          type: integer
          maximum: 2147483647.0
          minimum: 1.0
          title: Capacity
      additionalProperties: false
      type: object
      required:
      - capacity
      title: CapacityUpdate
    CsrfResponse:
      properties:
        csrf_token:
          type: string
          title: Csrf Token
      type: object
      required:
      - csrf_token
      title: CsrfResponse
    EmailPassword:
      properties:
        email:
          type: string
          maxLength: 254
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 1
          format: password
          title: Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: EmailPassword
    EmptyRequest:
      properties: {}
      additionalProperties: false
      type: object
      title: EmptyRequest
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorResponse
    EventCreate:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        description:
          type: string
          maxLength: 10000
          title: Description
          default: ''
        location:
          type: string
          maxLength: 300
          minLength: 1
          title: Location
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
        booking_closes_at:
          type: string
          format: date-time
          title: Booking Closes At
        capacity:
          type: integer
          maximum: 2147483647.0
          minimum: 1.0
          title: Capacity
      additionalProperties: false
      type: object
      required:
      - title
      - location
      - starts_at
      - ends_at
      - booking_closes_at
      - capacity
      title: EventCreate
    EventDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        location:
          type: string
          title: Location
        starts_at:
          type: string
          format: date-time
          title: Starts At
        booking_closes_at:
          type: string
          format: date-time
          title: Booking Closes At
        status:
