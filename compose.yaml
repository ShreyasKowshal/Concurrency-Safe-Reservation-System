name: csrs

x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    logging: *local-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local PostgreSQL password}
      POSTGRES_DB: ${POSTGRES_DB:?Set the application database name}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    logging: *local-logging
    restart: unless-stopped
    # Ephemeral development data; Redis never owns reservation capacity.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    logging: *local-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      CSRS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CSRS_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "csrs.migrate"]
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    logging: *local-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      CSRS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CSRS_REDIS_URL: redis://redis:6379/0
    command:
      - uvicorn
      - csrs.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
      - --log-level
      - ${CSRS_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./docs:/workspace/docs:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 5
      start_period: 10s

  worker:
    logging: *local-logging
    profiles: ["worker"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      CSRS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CSRS_REDIS_URL: redis://redis:6379/0
      CSRS_WORKER_POLL_INTERVAL_SECONDS: ${CSRS_WORKER_POLL_INTERVAL_SECONDS:-15}
      CSRS_WORKER_BATCH_SIZE: ${CSRS_WORKER_BATCH_SIZE:-100}
    command: ["python", "-m", "csrs.worker"]
    volumes:
      - ./backend:/workspace/backend
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    logging: *local-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CSRS_API_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      # Docker Desktop bind mounts may not forward Windows filesystem events.
      CSRS_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: csrs_test
      POSTGRES_PASSWORD: csrs_test_local_only
      POSTGRES_DB: csrs_test
    ports:
      - "127.0.0.1:5433:5432"
    # Disposable test data, deliberately separate from postgres_data.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csrs_test -d csrs_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["test"]
    environment:
      CSRS_TEST_DATABASE_URL: postgresql+psycopg://csrs_test:csrs_test_local_only@postgres-test:5432/csrs_test
      CSRS_TEST_REDIS_URL: redis://redis-test:6379/15
    command: ["pytest", "-p", "no:cacheprovider"]
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  redis-test:
    image: redis:7.4-alpine
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  frontend_node_modules:
